# Son of Anton — Backend Services
# Start all services: docker compose up -d
# Tear down everything: docker compose down -v
#
# SECURITY: every published port is bound to 127.0.0.1 so the services (and the
# FalkorDB/Qdrant data stores) are reachable only from the local host, not from
# other machines on the network. Inter-service traffic is unaffected — it flows
# over the internal Docker network via service names (e.g. `model-router:3200`).
# This closes the LAN / remote-host exposure; per-service authentication and
# DB passwords are still required to defend against other local processes and
# DNS-rebinding, and remain TODO for most services (background-tasks already
# requires a bearer token and stays unpublished).

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: soa-falkordb
    environment:
      # Require a password only when FALKORDB_PASSWORD is set; empty leaves FalkorDB open (dev default).
      - REDIS_ARGS=${FALKORDB_PASSWORD:+--requirepass ${FALKORDB_PASSWORD}}
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: soa-qdrant
    environment:
      # Require an API key on data endpoints only when QDRANT_API_KEY is set; /readyz stays open for probes.
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_REST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -qF ':18BD ' /proc/net/tcp6 2>/dev/null || grep -qF ':18BD ' /proc/net/tcp 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: soa-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-son_of_anton}
      - POSTGRES_USER=${DB_USER:-readonly}
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readonly -d son_of_anton"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  indexer:
    build:
      context: ./services/indexer
      dockerfile: Dockerfile
    container_name: soa-indexer
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_REST_PORT=${QDRANT_REST_PORT:-6333}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - PROJECT_PATH=/workspace
      - LANGUAGES=${LANGUAGES:-typescript,python,rust,csharp,cpp}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # Embedding settings — must match mcp-gateway (same variables) so
      # stored document vectors and query vectors come from the same model.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_ENDPOINT=${EMBEDDING_ENDPOINT:-}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-768}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  lsif:
    build:
      context: ./services/lsif
      dockerfile: Dockerfile
    container_name: soa-lsif
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - PROJECT_PATH=/workspace
      - LANGUAGES=${LANGUAGES:-typescript,python,rust,csharp,cpp}
      - PREFER_SCIP=${PREFER_SCIP:-false}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
      - lsif-snapshots:/data/lsif-snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mcp-gateway:
    build:
      context: ./services/mcp-gateway
      dockerfile: Dockerfile
    container_name: soa-mcp-gateway
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-3100}:3100"
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_REST_PORT=${QDRANT_REST_PORT:-6333}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - MCP_PORT=${MCP_PORT:-3100}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # Embedding settings — must match the indexer (same variables) so
      # stored document vectors and query vectors come from the same model.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_ENDPOINT=${EMBEDDING_ENDPOINT:-}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-768}
    volumes:
      - ./.son-of-anton/retrieval-weights.json:/app/.son-of-anton/retrieval-weights.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mcp-database:
    build:
      context: ./son-of-anton-mcp/servers/database
      dockerfile: Dockerfile
    container_name: soa-mcp-database
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_DATABASE_PORT:-3102}:3102"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-son_of_anton}
      - DB_USER=${DB_USER:-readonly}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - MCP_DATABASE_PORT=3102
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3102/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mcp-deployment:
    build:
      context: ./son-of-anton-mcp/servers/deployment
      dockerfile: Dockerfile
    container_name: soa-mcp-deployment
    ports:
      - "127.0.0.1:${MCP_DEPLOYMENT_PORT:-3103}:3103"
    environment:
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-CodeHalwell/Son-Of-Anton}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - MCP_DEPLOYMENT_PORT=3103
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3103/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mcp-tickets:
    build:
      context: ./son-of-anton-mcp/servers/tickets
      dockerfile: Dockerfile
    container_name: soa-mcp-tickets
    ports:
      - "127.0.0.1:${MCP_TICKETS_PORT:-3104}:3104"
    environment:
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-CodeHalwell/Son-Of-Anton}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - MCP_TICKETS_PORT=3104
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3104/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  owasp-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: [security]
    container_name: soa-owasp-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/JSON/core/view/version/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  penetration-tester:
    build:
      context: ./services/penetration-tester
      dockerfile: Dockerfile
    profiles: [security]
    container_name: soa-penetration-tester
    depends_on:
      owasp-zap:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PEN_TEST_PORT:-8092}:8092"
    environment:
      - PEN_TEST_PORT=${PEN_TEST_PORT:-8092}
      - ZAP_HOST=${ZAP_HOST:-owasp-zap}
      - ZAP_PORT=${ZAP_PORT:-8090}
      - TARGET_BASE_URL=${TARGET_BASE_URL:-http://localhost:3000}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - MAX_REQUESTS_PER_TEST=${MAX_REQUESTS_PER_TEST:-100}
      - TEST_TIMEOUT_MS=${TEST_TIMEOUT_MS:-60000}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8092' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  spec-pipeline:
    build:
      context: ./services/spec-pipeline
      dockerfile: Dockerfile
    container_name: soa-spec-pipeline
    ports:
      - "127.0.0.1:${SPEC_PIPELINE_PORT:-8090}:8090"
    environment:
      - SPEC_PIPELINE_PORT=${SPEC_PIPELINE_PORT:-8090}
      - SPECS_DIR=${SPECS_DIR:-.son-of-anton/specs}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8090' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mcp-playwright:
    build:
      context: ./son-of-anton-mcp/servers/playwright
      dockerfile: Dockerfile
    container_name: soa-mcp-playwright
    ports:
      - "127.0.0.1:${MCP_PLAYWRIGHT_PORT:-3105}:3105"
    environment:
      - MCP_PLAYWRIGHT_PORT=3105
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-localhost,127.0.0.1}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3105' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  background-tasks:
    build:
      context: ./services/background-tasks
      dockerfile: Dockerfile
    container_name: soa-background-tasks
    # SECURITY: This service mounts /var/run/docker.sock and can create containers.
    # We intentionally do NOT publish the port to the host by default. Other in-stack
    # services reach it via sandbox-net on `soa-background-tasks:8093`. If you need to
    # call it from the host, uncomment the localhost-bound port below — never expose
    # this service to a public interface.
    # ports:
    #   - "127.0.0.1:${BACKGROUND_TASKS_PORT:-8093}:8093"
    environment:
      - BACKGROUND_TASKS_PORT=${BACKGROUND_TASKS_PORT:-8093}
      - STATE_DIR=/data/background
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MCP_GATEWAY_URL=http://mcp-gateway:3100
      # SECURITY: Required. The service refuses to start without it.
      - BACKGROUND_TASK_API_TOKEN=${BACKGROUND_TASK_API_TOKEN:-}
      # SECURITY: Comma-separated list of additional container images allowed for tasks
      # (beyond the built-in default `soa-background-agent:latest`).
      - BACKGROUND_TASK_ALLOWED_IMAGES=${BACKGROUND_TASK_ALLOWED_IMAGES:-}
      # SECURITY: Bind-mount sources from POST /tasks must be inside this prefix.
      - BACKGROUND_TASK_WORKSPACE_ROOT=${BACKGROUND_TASK_WORKSPACE_ROOT:-/workspace}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    networks:
      - sandbox-net
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:rw
      - background-tasks-data:/data/background
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8093' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  visual-regression:
    build:
      context: ./services/visual-regression
      dockerfile: Dockerfile
    container_name: soa-visual-regression
    ports:
      - "127.0.0.1:${VISUAL_REGRESSION_PORT:-8094}:8094"
    environment:
      - VISUAL_REGRESSION_PORT=${VISUAL_REGRESSION_PORT:-8094}
      - BASELINES_DIR=/workspace/.son-of-anton/visual-baselines
      - DIFF_THRESHOLD=${DIFF_THRESHOLD:-0.01}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:rw
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8094' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  model-router:
    build:
      context: ./services/model-router
      dockerfile: Dockerfile
    container_name: soa-model-router
    ports:
      - "127.0.0.1:${MODEL_ROUTER_PORT:-3200}:3200"
    env_file: .env
    volumes:
      - ./services/model-router/config/model-routes.json:/app/config/routes.json:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  checkpoints:
    build:
      context: ./services/checkpoints
      dockerfile: Dockerfile
    container_name: soa-checkpoints
    ports:
      - "127.0.0.1:${CHECKPOINT_PORT:-3201}:3201"
    environment:
      - CHECKPOINT_PORT=${CHECKPOINT_PORT:-3201}
      - WORKSPACE_ROOT=/workspace
      - CHECKPOINT_STORAGE_PATH=/workspace/.son-of-anton/checkpoints
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:rw
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3201"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  walkthrough:
    build:
      context: ./services/walkthrough
      dockerfile: Dockerfile
    container_name: soa-walkthrough
    depends_on:
      model-router:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WALKTHROUGH_PORT:-3202}:3202"
    environment:
      - WALKTHROUGH_PORT=${WALKTHROUGH_PORT:-3202}
      - MODEL_ROUTER_URL=${MODEL_ROUTER_URL:-http://model-router:3200}
      - WALKTHROUGH_BASE_PATH=/workspace/.son-of-anton/walkthroughs
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:rw
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3202"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  acp-client:
    build:
      context: ./services/acp-client
      dockerfile: Dockerfile
    container_name: soa-acp-client
    ports:
      - "127.0.0.1:${ACP_PORT:-3300}:3300"
    environment:
      - ACP_PORT=${ACP_PORT:-3300}
      - ACP_CONFIG_PATH=/workspace/.son-of-anton/agents/acp-agents.json
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - PROJECT_PATH=/workspace
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3300' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  build-dag:
    build:
      context: ./services/build-dag
      dockerfile: Dockerfile
    container_name: soa-build-dag
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BUILD_DAG_PORT:-3301}:3301"
    environment:
      - BUILD_DAG_PORT=${BUILD_DAG_PORT:-3301}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - PROJECT_PATH=/workspace
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3301' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  context-sanitiser:
    build:
      context: ./services/context-sanitiser
      dockerfile: Dockerfile
    container_name: soa-context-sanitiser
    ports:
      - "127.0.0.1:${SANITISER_PORT:-3302}:3302"
    environment:
      - SANITISER_PORT=${SANITISER_PORT:-3302}
      - SOTA_SERVICE_TOKEN=${SOTA_SERVICE_TOKEN:-}
      - PROJECT_PATH=/workspace
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3302' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --- Optional tracing stack ---
  # Start with: docker compose --profile tracing up -d
  # Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 in your .env.
  # Jaeger UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: soa-jaeger
    profiles:
      - tracing
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_PORT:-4318}:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge

volumes:
  falkordb-data:
    driver: local
  qdrant-data:
    driver: local
  lsif-snapshots:
    driver: local
  background-tasks-data:
    driver: local
